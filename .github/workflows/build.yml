name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  linux:
    name: Linux desktop app
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          # Only the ayatana tray library is installed: the older
          # libappindicator3 conflicts with it on Ubuntu 24.04.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev
      - run: npm ci
      - run: npm run tauri:build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: src-tauri/target/release/bundle

  windows:
    name: Windows desktop app
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build -- --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: src-tauri/target/release/bundle
