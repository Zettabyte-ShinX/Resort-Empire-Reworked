[package]
name = "resort-empire-reworked"
version = "0.1.0"
description = "A cross-platform remake of the classic Flash game Resort Empire"
authors = ["Zettabyte-ShinX"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "resort_empire_reworked_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Deliberately not using LTO: on the target 1.6GHz Celeron a full LTO build
# of the final crate takes over half an hour, which makes iterating painful.
# The binary is a couple of megabytes either way.
opt-level = "s"
lto = false
codegen-units = 16
panic = "abort"
strip = true
